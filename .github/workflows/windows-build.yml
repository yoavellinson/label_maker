name: Build Windows App

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Build app with PyInstaller
        run: python -m PyInstaller --clean --noconfirm label_maker.spec

      - name: Upload portable app artifact
        uses: actions/upload-artifact@v4
        with:
          name: LabelMaker-portable-windows
          path: dist/LabelMaker

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        run: iscc installer/LabelMaker.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: LabelMaker-installer-windows
          path: dist/installer/LabelMakerSetup.exe
