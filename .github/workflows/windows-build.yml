name: Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - grid
      - worker-ui
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Verify bundled assets
        run: |
          if (!(Test-Path "grid\final_stickers.con_16.8.26 (1).pdf")) { throw "Missing grid\final_stickers.con_16.8.26 (1).pdf" }
          if (!(Test-Path "grid\Master_stickers_guide.pdf")) { throw "Missing grid\Master_stickers_guide.pdf" }
          if (!(Test-Path "grid\layout_presets.json")) { throw "Missing grid\layout_presets.json" }
          if (!(Test-Path "web\index.html")) { throw "Missing web\index.html" }
          if (!(Test-Path "VERSION")) { throw "Missing VERSION" }

      - name: Read version
        id: version
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $tag = $env:GITHUB_REF_NAME.TrimStart("v")
            if ($tag -ne $version) { throw "Tag v$tag does not match VERSION $version" }
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Run tests
        run: python -m unittest discover tests -v

      - name: Build standalone app
        run: python -m PyInstaller --clean --noconfirm label_maker.spec

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.version.outputs.value }}" installer\LabelMaker.iss'

      - name: Upload standalone app
        uses: actions/upload-artifact@v4
        with:
          name: LabelMaker-v2-windows-folder
          path: dist\LabelMaker_v2

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: LabelMaker-v2-windows-installer
          path: dist\installer\LabelMaker_v2_Setup.exe

      - name: Publish release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Label Maker ${{ steps.version.outputs.value }}
          files: dist/installer/LabelMaker_v2_Setup.exe
          generate_release_notes: true
