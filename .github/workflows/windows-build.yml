name: Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - grid
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Build standalone app
        run: python -m PyInstaller --clean --noconfirm label_maker.spec

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\LabelMaker.iss'

      - name: Upload standalone app
        uses: actions/upload-artifact@v4
        with:
          name: LabelMaker-windows-folder
          path: dist\LabelMaker

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: LabelMaker-windows-installer
          path: dist\installer\LabelMakerSetup.exe
